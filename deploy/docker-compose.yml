# ============================================================================
# 广宣法务审核 Agent —— 本地/内网后端编排
#
# 端口选择说明：
#   本机 3306 / 6379 / 9000 / 9001 / 6380 已被其他项目（coze、ragflow、dify 等）占用，
#   因此这里统一使用 3307 / 6381 / 9002+9003，避免抢占他人服务。
#
# 组件许可说明（见 docs/06-解析路线备选与许可证合规风险.md §2.1）：
#   * Valkey 使用 BSD-3-Clause，刻意不用 Redis 8（RSALv2/SSPLv1/AGPLv3 三重许可）。
#   * MySQL 8.4 为 GPLv2（作为独立服务使用不触发传染）。
#   * MinIO 使用 AGPLv3 —— 以独立服务形式部署、不修改其源码、不对外提供 MinIO 本身的
#     网络服务，通常可接受；若企业合规更严格，可替换为其他兼容 S3 的存储。
#
# 用法：
#   cd deploy
#   docker compose up -d
#   docker compose logs -f gw-audit
# ============================================================================

name: gw-audit

services:

  # ── 主数据库 ───────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    container_name: gw-audit-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # 触发器与 CHECK 约束依赖严格模式；不要放宽 sql_mode
      - --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${GW_DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${GW_DB_NAME:-gw_audit}
      MYSQL_USER: ${GW_DB_USER:-gw_audit}
      MYSQL_PASSWORD: ${GW_DB_PASSWORD:-gw_audit}
      TZ: Asia/Shanghai
    ports:
      - "${GW_DB_PORT:-3307}:3306"
    volumes:
      - gw-audit-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${GW_DB_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [gw-net]

  # ── 队列 / 进度 / 分布式锁 / 幂等键 / 令牌桶限流 ─────────────────────────────
  valkey:
    image: valkey/valkey:8
    container_name: gw-audit-valkey
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--save", "900 1"]
    ports:
      - "${GW_REDIS_PORT:-6381}:6379"
    volumes:
      - gw-audit-valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [gw-net]

  # ── 对象存储：物料原件与派生图（页面渲染图、视频帧） ─────────────────────────
  # 注意：物料权威副本只在这里。云模型的 Files API 一律设置过期并在 Case 归档时清理。
  minio:
    image: quay.io/minio/minio:RELEASE.2025-06-13T11-33-47Z-cpuv1
    container_name: gw-audit-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${GW_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${GW_MINIO_SECRET_KEY:-minioadmin}
      TZ: Asia/Shanghai
    ports:
      - "${GW_MINIO_PORT:-9002}:9000"
      - "${GW_MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - gw-audit-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [gw-net]

  # ── 后端应用 ───────────────────────────────────────────────────────────────
  gw-audit:
    build:
      context: ../gw-api
      dockerfile: Dockerfile
    image: gw-audit-api:local
    container_name: gw-audit-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      GW_DB_HOST: mysql
      GW_DB_PORT: "3306"
      GW_DB_NAME: ${GW_DB_NAME:-gw_audit}
      GW_DB_USER: ${GW_DB_USER:-gw_audit}
      GW_DB_PASSWORD: ${GW_DB_PASSWORD:-gw_audit}
      GW_REDIS_HOST: valkey
      GW_REDIS_PORT: "6379"
      GW_MINIO_ENDPOINT: http://minio:9000
      GW_MINIO_ACCESS_KEY: ${GW_MINIO_ACCESS_KEY:-minioadmin}
      GW_MINIO_SECRET_KEY: ${GW_MINIO_SECRET_KEY:-minioadmin}
      GW_MINIO_BUCKET: ${GW_MINIO_BUCKET:-gw-audit}
      # AI 供应商：mock（默认，无需 API Key）| dashscope（千问大模型，需 API Key）
      GW_AI_PROVIDER: ${GW_AI_PROVIDER:-mock}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      # 可选：使用业务空间专属域名时覆盖（官方建议迁移，性能与稳定性更好）
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com}
      DASHSCOPE_COMPAT_BASE_URL: ${DASHSCOPE_COMPAT_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      # 模型型号与调用参数：留空即用 application.yml 的默认值
      GW_MODEL_TEXT: ${GW_MODEL_TEXT:-}
      GW_MODEL_VISION: ${GW_MODEL_VISION:-}
      GW_MODEL_OCR_PRIMARY: ${GW_MODEL_OCR_PRIMARY:-}
      GW_MODEL_OCR_FALLBACK: ${GW_MODEL_OCR_FALLBACK:-}
      GW_MODEL_ASR: ${GW_MODEL_ASR:-}
      # 数值型配置必须给真实默认值，不能写 ${VAR:-}：
      # 空字符串会被 Spring 当成"要绑定的值"去转 int，直接导致启动失败
      # （A null value cannot be assigned to a primitive type）。
      # 这里与 application.yml 的默认值保持一致。
      GW_AI_READ_TIMEOUT_MS: ${GW_AI_READ_TIMEOUT_MS:-120000}
      GW_AI_MAX_ATTEMPTS: ${GW_AI_MAX_ATTEMPTS:-3}
      GW_JWT_SECRET: ${GW_JWT_SECRET:-local-dev-secret-change-me-at-least-32-bytes}
      GW_LOG_LEVEL: ${GW_LOG_LEVEL:-INFO}
    ports:
      - "${GW_APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [gw-net]

volumes:
  gw-audit-mysql-data:
  gw-audit-valkey-data:
  gw-audit-minio-data:

networks:
  gw-net:
    driver: bridge
